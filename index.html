
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Valentine's Day ❤️</title>

    <style>
        body {
            background: #ffe4ec;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px 15px;
            margin: 0;
        }

        .card {
            background: white;
            max-width: 400px;
            margin: 40px auto;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 5px 15px #e8a1b2;
        }

        h1 {
            color: #e63963;
        }

        .heart {
            font-size: 65px;
        }

        p {
            color: #b8325c;
            font-size: 17px;
            line-height: 1.6;
        }

        .footer {
            margin-top: 25px;
            color: #e63963;
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="heart">❤️</div>

        <h1>Happy Valentine's Day!</h1>

        <p>You make my world brighter every day.</p>
        <p>Your smile is my favorite thing to see.</p>
        <p>You make every moment feel special.</p>
        <p>My heart is happiest when I am with you.</p>
        <p>You are my favorite person today and always.</p>

        <div class="heart">💐</div>

        <div class="footer">Made with love 💕</div>
    </div>

</body>
</html>
